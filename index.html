<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>مصاريفي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone ledger — month hero up top, sections below, fixed bottom tab bar and a floating add button. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EDF0F6; --line:#DDE2EC; --hero:#13203A;
  --fg:#13203A; --muted:#5E6984; --accent:#B07F1E; --accent-ink:#FFFFFF; --accent-soft:#FBF3E1;
  --primary:#13203A; --primary-ink:#FFFFFF;
  --good:#1E9E72; --fixed:#4F6BD8; --fixed-soft:#E6EBFB; --warn:#B26B00; --warn-soft:#FDF0D8; --bad:#C8352B; --bad-soft:#FBE3E0;
  --shadow:0 6px 20px rgba(19,32,58,.10);
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.brand svg{width:42px;height:42px;flex:none;border-radius:12px;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.mswitch{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mswitch button{border:0;background:none;color:var(--fg);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.mswitch button:hover{background:var(--sunk)}
.mswitch span{font-weight:600;font-size:14px;min-width:96px;text-align:center}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gear{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.gear[aria-current="page"]{border-color:var(--primary);background:var(--primary);color:#FFFFFF}
.morebtn{border:0;background:none;color:var(--fixed);font-weight:600;padding:12px 14px;width:100%;cursor:pointer;border-top:1px solid var(--line);font-size:14px}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#22355E 0%,#13203A 60%);color:#FFFFFF;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.hero .lbl{font-size:14px;color:#B9C3DA}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.1;color:#E8C06A}
.hero .big .cur{font-size:.42em;font-weight:500;margin-inline-start:6px;opacity:.85}
.stack{height:10px;border-radius:99px;background:#2A3A5E;display:flex;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.stack .f{background:#8FA6FF}
.stack .v{background:#E8C06A}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio b{font-family:var(--f-display);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.trio span{font-size:12.5px;color:#B9C3DA}
.hero .setinc{align-self:flex-start;border:1px solid #E8C06A;background:none;color:#FFFFFF;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.hero.neg .big{color:#FF8A80}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--fg);font-size:14px}
.alert b{color:var(--warn)}
.alert.bad{background:var(--bad-soft)} .alert.bad b{color:var(--bad)}

section h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:inherit;background:none;border-inline:0;border-bottom:0;color:inherit;font:inherit;cursor:pointer}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* budgets */
.bud{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud .hd{display:flex;align-items:center;gap:8px;font-size:14px}
.bud .hd .nm{flex:1;min-width:0;font-weight:600}
.bud .hd .v{font-size:13px;color:var(--muted);white-space:nowrap}
.bud .remwrap{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.bud .remwrap small{font-size:12px;color:var(--muted)}
.bud .rem{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--good)}
.bud .rem.warn{color:var(--warn)} .bud .rem.over{color:var(--bad)}
.bud .rembar i{background:var(--good);transition:width .4s ease}
.bud .rembar.warn i{background:var(--warn)} .bud .rembar.over i{background:var(--bad)}
.bud .sub{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bud .rembar i{transition:none}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--bad)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.over{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.fix{background:var(--fixed-soft);color:var(--fixed)} .tag.done{background:var(--sunk);color:var(--muted)} .tag.soon{background:var(--accent-soft);color:var(--accent)}

.day{font-size:12.5px;color:var(--muted);font-weight:600;padding:14px 4px 6px;display:flex;justify-content:space-between}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:16px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;font-size:15.5px;cursor:pointer;background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* fixed cards */
.fx{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;cursor:pointer;background:none;border-inline:0;border-bottom:0;width:100%;text-align:inherit;color:inherit;font:inherit}
.fx:first-child{border-top:0}
.fx:hover{background:var(--sunk)}
.fx .hd{display:flex;align-items:center;gap:8px}
.fx .hd .nm{flex:1;min-width:0;font-weight:600}
.fx .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.fx .bar i{background:var(--fixed)}
.fx.ended{opacity:.6}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum2 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum2 span{font-size:12.5px;color:var(--muted);display:block}
.sum2 b{font-family:var(--f-display);font-size:18px}


/* analytics */
.yswitch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yswitch .yl{font-family:var(--f-display);font-weight:800;font-size:20px}
.yswitch .mswitch span{min-width:60px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:19px;font-weight:700;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}.kpi.hl b{color:var(--accent)}
.kpi .up{color:var(--bad)} .kpi .down{color:var(--good)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.chartbox .axl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chartbox .mlab{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chartbox .mlab.cur{fill:var(--fg);font-weight:700}
.chartbox .bf{fill:var(--fixed)} .chartbox .bv{fill:var(--accent)}
.chartbox .proj .bf,.chartbox .proj .bv{opacity:.32}
.chartbox .proj .outline{fill:none;stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.chartbox .inc{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.chartbox .inclab{fill:var(--warn);font-size:10px;font-weight:600;font-family:var(--f-body)}
.chartbox .hit{fill:transparent;cursor:pointer}
.chartbox .hit:hover{fill:var(--sunk);opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:6px 6px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.catbar{display:flex;flex-direction:column;gap:5px;padding:11px 14px;border-top:1px solid var(--line)}
.catbar:first-child{border-top:0}
.catbar .hd{display:flex;gap:8px;align-items:center;font-size:14px}
.catbar .hd .nm{flex:1;min-width:0;font-weight:600}
.catbar .hd .v{font-size:13px;color:var(--muted);white-space:nowrap}
.catbar .bar i{background:var(--c,var(--accent))}
.tl{display:flex;flex-direction:column}
.tl .it{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.tl .it:first-child{border-top:0}
.tl .when{font-family:var(--f-display);font-weight:700;font-size:13px;min-width:78px;color:var(--fixed)}
.tl .what{flex:1;min-width:0;font-size:14px}
.tl .what small{display:block;color:var(--muted);font-size:12.5px}


/* alerts + advisor */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--warn);color:var(--surface)}
.alert.bad .ic{background:var(--bad)}
.alert.info{background:var(--accent-soft)} .alert.info .ic{background:var(--accent)} .alert.info b{color:var(--accent)}
.adv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.adv .asks{display:grid;grid-template-columns:1fr;gap:8px}
.adv .ask{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;cursor:pointer;font-size:14px;font-weight:600}
.adv .ask:hover{border-color:var(--accent)}
.adv .ask small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.adv .ask:disabled{opacity:.55;cursor:default}
.adv .out{font-size:14.5px;line-height:1.75;border-top:1px solid var(--line);padding-top:12px}
.adv .out h4{margin:10px 0 4px;font-family:var(--f-display);font-size:15px}
.adv .out ul{margin:4px 0;padding-inline-start:20px}
.adv .out p{margin:6px 0}
.adv .note{font-size:12px;color:var(--muted)}

/* nav + fab */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;color:var(--muted);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--primary)}nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}
.fab{position:fixed;z-index:21;left:max(18px,calc(env(safe-area-inset-left,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--primary);color:#FFFFFF;box-shadow:0 8px 24px rgba(19,32,58,.28);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:#E8C06A;stroke-width:2.4;fill:none;stroke-linecap:round}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--sunk);color:var(--fg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.amount-in{font-family:var(--f-display);font-size:30px;font-weight:700;text-align:center;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.actions{display:flex;gap:10px} .actions .btn{flex:1}
.err{color:var(--bad);font-size:13px;min-height:1em}
.hint{font-size:12.5px;color:var(--muted)}

/* settings */
.setrow{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow input{padding:9px 10px}
.x{border:0;background:var(--sunk);color:var(--muted);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:12px 14px;cursor:pointer;font-size:14px;text-align:start;width:100%;border-top:1px solid var(--line)}
.status{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#13203A"/><circle cx="50" cy="50" r="30" fill="none" stroke="#24324F" stroke-width="12"/><circle cx="50" cy="50" r="30" fill="none" stroke="#3CC79A" stroke-width="12" stroke-dasharray="120 68.5" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="30" fill="none" stroke="#D9AE52" stroke-width="12" stroke-dasharray="36 152.5" stroke-dashoffset="-126" transform="rotate(-90 50 50)"/><path d="M40 58 L48 50 L53 55 L61 44" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><span style="font-family:var(--f-display)">مصاريفي</span><small id="modeNote">جاري التحميل…</small></div></div>
    <div class="mswitch" aria-label="اختيار الشهر">
      <button type="button" data-act="mprev" aria-label="الشهر اللي فات">›</button>
      <span id="mlabel" class="num"></span>
      <button type="button" data-act="mnext" aria-label="الشهر الجاي">‹</button>
    </div>
  </header>
  <main id="view" class="wrap"></main>
</div>

<button class="fab" type="button" data-act="addExp" aria-label="إضافة مصروف"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="الأقسام"><div class="in">
  <button type="button" data-tab="month"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>الشهر</button>
  <button type="button" data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>المصروفات</button>
  <button type="button" data-tab="fixed"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>الالتزامات</button>
  <button type="button" data-tab="analytics"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>التحليلات</button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
</div></nav>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DEFAULT_CATS=[["أكل وبقالة",6000],["مواصلات وبنزين",2500],["فواتير (كهرباء/مياه/غاز)",1500],["صحة وأدوية",1000],
 ["تعليم وأطفال",2000],["ملابس",1000],["خروجات وترفيه",1500],["هدايا ومناسبات",800],["كورسات وتطوير ذاتي",1500],
 ["صيانة (عربية/بيت/أجهزة)",1000],["سفر ومصايف",1500],["أجهزة ومشتريات كبيرة",1000],["ادخار واستثمار",3000],["متنوع",1000]]
 .map(([name,budget])=>({name,budget}));
const DEFAULT_PAYS=["كاش","فيزا/كريدت","محفظة إلكترونية","إنستاباي","تحويل بنكي"];
const FTYPES=["قسط","إيجار","اشتراك","فاتورة ثابتة","التزام عائلي","جمعية","تأمين","أخرى"];

const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const THIS_YM=TODAY.slice(0,7);
const SD=()=>Math.min(28,Math.max(1,Math.round(Number(S.settings.startDay)||1)));
const pStart=ym=>`${ym}-${pad(SD())}`;
const pEnd=ym=>`${addM(ym,1)}-${pad(SD())}`;
const inP=(d,ym)=>!!d&&d>=pStart(ym)&&d<pEnd(ym);
const periodOf=d=>{const ym=d.slice(0,7);return Number(d.slice(8,10))>=SD()?ym:addM(ym,-1)};
const CUR=()=>periodOf(TODAY);
const dayDiff=(a,b)=>{const[ay,am,ad]=a.split("-").map(Number),[by,bm,bd]=b.split("-").map(Number);return Math.round((new Date(by,bm-1,bd)-new Date(ay,am-1,ad))/864e5)};
const pLen=ym=>dayDiff(pStart(ym),pEnd(ym));
const pElapsed=ym=>Math.min(pLen(ym),Math.max(1,dayDiff(pStart(ym),TODAY)+1));
const pRangeText=ym=>{const[y,m]=ym.split("-").map(Number);const e=new Date(y,m,SD()-1);return`من ${SD()} ${MONTHS[m-1]} لـ ${e.getDate()} ${MONTHS[e.getMonth()]}`};
const addM=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return`${y}-${pad(m)}`};
const diffM=(a,b)=>{const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return(by-ay)*12+(bm-am)};
const ymLabel=ym=>{const[y,m]=ym.split("-").map(Number);return`${MONTHS[m-1]} ${y}`};
const fmt=n=>Math.round(Number(n)||0).toLocaleString("en-US");
const money=n=>`${fmt(n)} ج.م`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hueOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const catColor=name=>`hsl(${hueOf(name)} 48% 50%)`;
const dayLabel=d=>{const[y,m,dd]=d.split("-").map(Number);const w=new Date(y,m-1,dd).toLocaleDateString("ar-EG",{weekday:"long"});return`${w} ${dd} ${MONTHS[m-1]}`};

const S={tab:"month",ym:THIS_YM,settings:{income:0,startDay:1,cats:DEFAULT_CATS,pays:DEFAULT_PAYS},expenses:[],fixed:[],mode:"loading",settingsLoaded:false};
try{const t=localStorage.getItem("masarif.tab");if(t)S.tab=t}catch(e){}

/* ---------- storage ---------- */
let api=null;
function localApi(){
  const KEY="masarif.data";
  try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){if(d.settings)S.settings={...S.settings,...d.settings};S.expenses=d.expenses||[];S.fixed=d.fixed||[]}}catch(e){}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({settings:S.settings,expenses:S.expenses,fixed:S.fixed}))}catch(e){}};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  return{
    start(){S.settingsLoaded=true;render()},
    async saveSettings(s){S.settings=s;persist();render()},
    async put(kind,id,data){id=id||uid();const arr=S[kind];const i=arr.findIndex(x=>x.id===id);const rec={...data,id};if(i>=0)arr[i]=rec;else arr.push(rec);persist();render()},
    async del(kind,id){S[kind]=S[kind].filter(x=>x.id!==id);persist();render()}
  };
}
function dbApi(root){
  const q=[];let busy=false;
  const run=async()=>{if(busy)return;busy=true;while(q.length){const f=q.shift();try{await f()}catch(e){toast(errMsg(e))}}busy=false};
  const enqueue=f=>new Promise(res=>{q.push(async()=>{await f();res()});run()});
  return{
    start(){
      root.onSnapshot(s=>{if(s.exists){const d=s.data();S.settings={income:Number(d.income)||0,startDay:Number(d.startDay)||1,cats:Array.isArray(d.cats)&&d.cats.length?d.cats:DEFAULT_CATS,pays:Array.isArray(d.pays)&&d.pays.length?d.pays:DEFAULT_PAYS}}S.settingsLoaded=true;render()},e=>{toast(errMsg(e))});
      root.collection("expenses").onSnapshot(s=>{S.expenses=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>toast(errMsg(e)));
      root.collection("fixed").onSnapshot(s=>{S.fixed=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>toast(errMsg(e)));
    },
    saveSettings(s){return enqueue(()=>root.set({income:s.income,startDay:s.startDay||1,cats:s.cats,pays:s.pays}))},
    put(kind,id,data){const col=root.collection(kind);const ref=id?col.doc(id):col.doc();const body={...data};delete body.id;return enqueue(()=>ref.set(body))},
    del(kind,id){return enqueue(()=>root.collection(kind).doc(id).delete())}
  };
}
function errMsg(e){const c=e&&e.code;if(c==="quota_exceeded")return"المساحة امتلت. امسح مصروفات قديمة وجرّب تاني.";if(c==="permission_denied"||c==="not_granted")return"مش مسموح بالحفظ من الحساب ده.";if(c==="unavailable")return"مفيش اتصال دلوقتي. هيتحفظ لما النت يرجع.";return"الحفظ ماتمّش. جرّب تاني."}

async function init(){
  render();
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  }
  if(db&&user){try{const id=await user.id();if(id){api=dbApi(db.doc(`data/users/${id}/app`));S.mode="cloud"}}catch(e){}}
  if(!api){api=localApi();S.mode="local"}
  api.start();render();
}

/* ---------- derived ---------- */
const fixedActive=(f,ym)=>f.start&&f.start<=ym&&(!f.end||f.end>=ym);
function monthData(ym){
  const ex=S.expenses.filter(e=>inP(e.date,ym));
  const variable=ex.reduce((a,e)=>a+(Number(e.amount)||0),0);
  const fx=S.fixed.filter(f=>fixedActive(f,ym));
  const fixed=fx.reduce((a,f)=>a+(Number(f.amount)||0),0);
  const byCat={};for(const e of ex)byCat[e.cat]=(byCat[e.cat]||0)+(Number(e.amount)||0);
  return{ex,variable,fx,fixed,byCat,income:Number(S.settings.income)||0};
}
function fixedInfo(f){
  const total=f.end?diffM(f.start,f.end)+1:null;
  const left=f.end?Math.max(0,diffM(THIS_YM,f.end)+1):null;
  const started=f.start<=THIS_YM;
  const ended=f.end&&f.end<THIS_YM;
  const paid=total!=null?Math.min(total,Math.max(0,total-left)):null;
  let next="";
  if(!ended&&f.day){const d=Math.min(Number(f.day),28)===Number(f.day)?Number(f.day):Number(f.day);
    let ym=started?THIS_YM:f.start; if(started&&Number(now.getDate())>Number(f.day))ym=addM(THIS_YM,1);
    if(!f.end||ym<=f.end){const[y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();next=`${ym}-${pad(Math.min(d,last))}`}}
  return{total,left,ended,started,paid,next,remainingAmt:left!=null?left*(Number(f.amount)||0):null};
}
const daysUntil=d=>{const[y,m,dd]=d.split("-").map(Number);return Math.round((new Date(y,m-1,dd)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5)};

/* ---------- render ---------- */
function render(){
  if(S.settingsLoaded&&!S.ymTouched)S.ym=CUR();
  document.getElementById("mlabel").textContent=ymLabel(S.ym);
  document.getElementById("modeNote").textContent=S.mode==="cloud"?"محفوظ في حسابك":S.mode==="local"?"محفوظ على الجهاز ده بس":"جاري التحميل…";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.toggleAttribute("aria-current",false)||b.dataset.tab===S.tab&&b.setAttribute("aria-current","page"));
  const v=document.getElementById("view");
  if(!["month","list","fixed","analytics","settings"].includes(S.tab))S.tab="month";
  v.innerHTML=S.tab==="analytics"?viewAnalytics():S.tab==="list"?viewList():S.tab==="fixed"?viewFixed():S.tab==="settings"?viewSettings():viewMonth();
  document.querySelector(".fab").hidden=S.tab==="settings"||S.tab==="analytics";
  document.querySelector(".mswitch").style.visibility=(S.tab==="fixed"||S.tab==="settings"||S.tab==="analytics")?"hidden":"visible";
}

function viewMonth(){
  const d=monthData(S.ym);const spent=d.variable+d.fixed;const left=d.income-spent;
  const fp=d.income?Math.min(100,d.fixed/d.income*100):0, vp=d.income?Math.min(100-fp,d.variable/d.income*100):0;
  const ratio=d.income?d.fixed/d.income:0;
  let h=`<div class="hero ${d.income&&left<0?"neg":""}">`;
  if(d.income){
    h+=`<div><div class="lbl">اللي فاضل من الدخل — ${ymLabel(S.ym)}${SD()>1?`<br><span style="font-size:12.5px">${pRangeText(S.ym)}</span>`:""}</div><div class="big num">${fmt(left)}<span class="cur">ج.م</span></div></div>
    <div class="stack" role="img" aria-label="توزيع الدخل"><i class="f" style="width:${fp}%"></i><i class="v" style="width:${vp}%"></i></div>`;
  }else{
    h+=`<div><div class="lbl">إجمالي المصروف — ${ymLabel(S.ym)}</div><div class="big num">${fmt(spent)}<span class="cur">ج.م</span></div></div>
    <button class="setinc" type="button" data-act="goSettings">اكتب دخلك الشهري عشان نحسب اللي فاضل</button>`;
  }
  h+=`<div class="trio num"><div><span>الدخل</span><b>${fmt(d.income)}</b></div><div><span>التزامات ثابتة</span><b>${fmt(d.fixed)}</b></div><div><span>مصاريف متغيرة</span><b>${fmt(d.variable)}</b></div></div></div>`;
  if(S.ym===CUR())h+=alertsBlock(d);

  if(S.ym===CUR()){
    const soon=S.fixed.map(f=>({f,i:fixedInfo(f)})).filter(x=>x.i.next&&daysUntil(x.i.next)>=0&&daysUntil(x.i.next)<=10).sort((a,b)=>a.i.next.localeCompare(b.i.next));
    if(soon.length){h+=`<section><h2>مستحق قريب<small>خلال 10 أيام</small></h2><div class="panel">`+soon.map(({f,i})=>{const n=daysUntil(i.next);
      return`<button class="row" type="button" data-act="editFixed" data-id="${esc(f.id)}"><span class="dot" style="background:var(--fixed)"></span><span class="main"><span class="t">${esc(f.name)}</span><span class="s">${n===0?"النهارده":n===1?"بكره":`بعد ${n} أيام`} · ${dayLabel(i.next)}</span></span><span class="amt num">${money(f.amount)}</span></button>`}).join("")+`</div></section>`}
  }


  const cats=S.settings.cats.filter(c=>Number(c.budget)>0||d.byCat[c.name]);
  const extra=Object.keys(d.byCat).filter(k=>!S.settings.cats.some(c=>c.name===k)).map(k=>({name:k,budget:0}));
  const all=[...cats,...extra].sort((a,b)=>(d.byCat[b.name]||0)-(d.byCat[a.name]||0));
  h+=`<section><h2>الميزانيات<small class="num">متبقي ${money(S.settings.cats.reduce((a,c)=>a+(Number(c.budget)||0),0)-d.variable)} من ${money(S.settings.cats.reduce((a,c)=>a+(Number(c.budget)||0),0))}</small></h2><div class="panel">`;
  const isCur=S.ym===CUR(),daysLeft=isCur?pLen(S.ym)-pElapsed(S.ym)+1:0;
  h+=all.map(c=>{const sp=d.byCat[c.name]||0,b=Number(c.budget)||0,rem=b-sp,p=b?sp/b:(sp?1.01:0);
    const cls=!b||rem<0?"over":rem/b<=.2?"warn":"";
    const remPct=b?Math.max(0,rem/b*100):0;
    const big=!b?`<span class="rem over num">${fmt(sp)}</span>`:rem<0?`<span class="rem over num">−${fmt(-rem)}</span>`:`<span class="rem ${cls} num">${fmt(rem)}</span>`;
    const lbl=!b?"بدون ميزانية":rem<0?"عدّيت الميزانية":"متبقي";
    const sub=!b?`اتصرف ${fmt(sp)} ج.م`:`اتصرف <span class="num">${fmt(sp)}</span> من <span class="num">${fmt(b)}</span>${isCur&&rem>0&&daysLeft>1?` · <span class="num">${fmt(rem/daysLeft)}</span> في اليوم`:""}`;
    return`<div class="bud"><div class="hd"><span class="dot" style="background:${catColor(c.name)}"></span><span class="nm">${esc(c.name)}</span><span class="remwrap"><small>${lbl}</small>${big}</span></div><div class="bar rembar ${cls}"><i style="width:${b?(rem<0?100:remPct):100}%"></i></div><div class="sub">${sub}</div></div>`}).join("")||`<div class="empty">مفيش ميزانيات لسه</div>`;
  h+=`</div></section>`;

  if(!d.ex.length&&!d.fx.length&&S.settingsLoaded){
    h+=`<div class="empty"><b>لسه مفيش مصاريف في ${ymLabel(S.ym)}</b>اضغط زرار + تحت عشان تسجّل أول مصروف، وضيف أقساطك من «الالتزامات».<button class="btn" type="button" data-act="addExp">سجّل مصروف</button></div>`;
  }
  return h;
}

function expenseGroups(ex,maxDays){
  const groups={};for(const e of ex){(groups[e.date]=groups[e.date]||[]).push(e)}
  return Object.keys(groups).sort().reverse().slice(0,maxDays).map(day=>{const list=groups[day];const tot=list.reduce((a,e)=>a+(Number(e.amount)||0),0);
    return`<div><div class="day"><span>${dayLabel(day)}</span><span class="num">${money(tot)}</span></div><div class="panel">`+
    list.map(e=>`<button class="row" type="button" data-act="editExp" data-id="${esc(e.id)}"><span class="dot" style="background:${catColor(e.cat)}"></span><span class="main"><span class="t">${esc(e.item||e.cat)}</span><span class="s">${esc(e.cat)}${e.pay?" · "+esc(e.pay):""}</span></span><span class="amt num">${fmt(e.amount)}</span></button>`).join("")+`</div></div>`}).join("");
}
function viewList(){
  const d=monthData(S.ym);
  if(!d.ex.length)return`<div class="empty"><b>مفيش مصروفات متسجلة في ${ymLabel(S.ym)}</b>كل مصروف بتسجله هيظهر هنا متقسم بالأيام.<button class="btn" type="button" data-act="addExp">سجّل مصروف</button></div>`+exportBlock();
  const groups={};for(const e of d.ex){(groups[e.date]=groups[e.date]||[]).push(e)}
  let h=`<div class="sum2 num"><div><span>إجمالي المتغير</span><b>${money(d.variable)}</b></div><div><span>عدد المصروفات</span><b>${d.ex.length}</b></div></div>`;
  for(const day of Object.keys(groups).sort().reverse()){
    const list=groups[day];const tot=list.reduce((a,e)=>a+(Number(e.amount)||0),0);
    h+=`<div><div class="day"><span>${dayLabel(day)}</span><span class="num">${money(tot)}</span></div><div class="panel">`+
      list.map(e=>`<button class="row" type="button" data-act="editExp" data-id="${esc(e.id)}"><span class="dot" style="background:${catColor(e.cat)}"></span><span class="main"><span class="t">${esc(e.item||e.cat)}</span><span class="s">${esc(e.cat)}${e.pay?" · "+esc(e.pay):""}${e.note?" · "+esc(e.note):""}</span></span><span class="amt num">${fmt(e.amount)}</span></button>`).join("")+`</div></div>`;
  }
  return h+exportBlock();
}
function exportBlock(){return`<div class="actions"><button class="btn ghost" type="button" data-act="export">تصدير كل البيانات لملف Excel</button></div>`}

function viewFixed(){
  const items=S.fixed.map(f=>({f,i:fixedInfo(f)}));
  const active=items.filter(x=>!x.i.ended).sort((a,b)=>(a.i.left??999)-(b.i.left??999));
  const ended=items.filter(x=>x.i.ended);
  const monthly=S.fixed.filter(f=>fixedActive(f,THIS_YM)).reduce((a,f)=>a+(Number(f.amount)||0),0);
  const remaining=items.reduce((a,x)=>a+(x.i.remainingAmt||0),0);
  let h=`<div class="sum2 num"><div><span>التزامات الشهر ده</span><b>${money(monthly)}</b></div><div><span>متبقي على الأقساط</span><b>${money(remaining)}</b></div></div>`;
  h+=`<button class="btn" type="button" data-act="addFixed">+ إضافة قسط أو التزام</button>`;
  if(!items.length)return h+`<div class="empty"><b>مفيش التزامات لسه</b>سجّل الأقساط والإيجار والاشتراكات والجمعيات مرة واحدة، وهتتحسب لوحدها في كل شهر لحد ما تخلص.</div>`;
  const card=({f,i})=>{
    const st=i.ended?`<span class="tag done">خلص</span>`:!i.started?`<span class="tag soon">يبدأ ${ymLabel(f.start)}</span>`:i.left!=null&&i.left<=2?`<span class="tag soon">فاضل ${i.left===1?"شهر":"شهرين"}</span>`:`<span class="tag fix">${esc(f.type||"التزام")}</span>`;
    const prog=i.total?`<div class="bar"><i style="width:${Math.round(i.paid/i.total*100)}%"></i></div>`:"";
    const meta=[`<span class="num">${money(f.amount)} شهرياً</span>`,
      i.total?`<span class="num">اتدفع ${i.paid} من ${i.total}</span>`:`<span>مستمر</span>`,
      i.remainingAmt?`<span class="num">متبقي ${money(i.remainingAmt)}</span>`:"",
      i.next?`<span>الجاي: ${dayLabel(i.next)}</span>`:""].filter(Boolean).join("");
    return`<button class="fx ${i.ended?"ended":""}" type="button" data-act="editFixed" data-id="${esc(f.id)}"><div class="hd"><span class="nm">${esc(f.name)}</span>${st}</div>${prog}<div class="meta">${meta}</div></button>`};
  h+=`<section><h2>شغّالة<small>${active.length}</small></h2><div class="panel">${active.map(card).join("")||'<div class="bud">مفيش</div>'}</div></section>`;
  if(ended.length)h+=`<section><h2>خلصت<small>${ended.length}</small></h2><div class="panel">${ended.map(card).join("")}</div></section>`;
  return h;
}

let draft=null;
function viewSettings(){
  if(!draft)draft=JSON.parse(JSON.stringify(S.settings));
  const total=draft.cats.reduce((a,c)=>a+(Number(c.budget)||0),0);
  return`<section><h2>الدخل الشهري</h2><div class="field"><input id="s-income" class="num" inputmode="decimal" value="${esc(draft.income||"")}" placeholder="مثلاً 25000" aria-label="الدخل الشهري"></div></section>
  <section><h2>يوم بداية الشهر عندك</h2><div class="field"><input id="s-start" class="num" inputmode="numeric" value="${esc(draft.startDay||1)}" placeholder="1 – 28" aria-label="يوم بداية الشهر"><p class="hint">اليوم اللي بينزل فيه المرتب. لو كتبت 25، الشهر عندك هيبدأ من يوم 25 لحد يوم 24 اللي بعده، والميزانيات والتقارير هتتحسب على كده.</p></div></section>

const MSHORT=["ينا","فبر","مار","أبر","ماي","يون","يول","أغس","سبت","أكت","نوف","ديس"];
S.ay=Number(THIS_YM.slice(0,4));
const kfmt=n=>{n=Math.round(n);return Math.abs(n)>=1000?(n/1000).toFixed(Math.abs(n)>=10000?0:1).replace(/\.0$/,"")+"k":String(n)};
const varOf=ym=>S.expenses.reduce((a,e)=>a+(inP(e.date,ym)?(Number(e.amount)||0):0),0);
const fixedOf=ym=>S.fixed.reduce((a,f)=>a+(fixedActive(f,ym)?(Number(f.amount)||0):0),0);
function avgVariable(){
  const past=[];for(let k=1;k<=12&&past.length<3;k++){const ym=addM(CUR(),-k);const v=varOf(ym);if(v>0)past.push(v)}
  if(past.length)return{v:past.reduce((a,b)=>a+b,0)/past.length,basis:`متوسط آخر ${past.length===1?"شهر":past.length===2?"شهرين":"3 شهور"}`};
  const cur=varOf(CUR());const dom=pElapsed(CUR()),dim=pLen(CUR());
  if(cur>0)return{v:cur/dom*dim,basis:"على أساس صرف الشهر ده"};
  const b=S.settings.cats.reduce((a,c)=>a+(Number(c.budget)||0),0);
  return{v:b,basis:"على أساس الميزانيات"};
}
function viewAnalytics(){

  const actual=months.filter(x=>!x.fut),proj=months.filter(x=>x.fut);

function barChart(months,inc){
  const W=360,H=210,pl=6,pr=34,pt=14,pb=24,cw=W-pl-pr,ch=H-pt-pb,bw=cw/12;
  const maxV=Math.max(1,inc,...months.map(x=>x.t));
  const step=(()=>{const raw=maxV/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p})();
  const top=Math.ceil(maxV/step)*step,y=v=>pt+ch-(v/top)*ch;
  let g="";
  for(let t=0;t<=top+0.001;t+=step){g+=`<line class="grid" x1="${pl}" x2="${pl+cw}" y1="${y(t)}" y2="${y(t)}"/><text class="axl" x="${W-2}" y="${y(t)+3}" text-anchor="end">${kfmt(t)}</text>`}
  months.forEach((x,i)=>{const cx=pl+cw-(i+.5)*bw,w=Math.max(6,bw*.62),x0=cx-w/2;
    const yf=y(x.f),yv=y(x.f+x.v);
    g+=`<g class="${x.fut?"proj":""}">${x.f>0?`<rect class="bf" x="${x0}" y="${yf}" width="${w}" height="${Math.max(0,pt+ch-yf)}" rx="2"/>`:""}${x.v>0?`<rect class="bv" x="${x0}" y="${yv}" width="${w}" height="${Math.max(0,yf-yv)}" rx="2"/>`:""}${x.fut&&x.t>0?`<rect class="outline" x="${x0}" y="${yv}" width="${w}" height="${pt+ch-yv}" rx="2"/>`:""}</g>`;
    g+=`<text class="mlab ${x.cur?"cur":""}" x="${cx}" y="${H-8}" text-anchor="middle">${MSHORT[x.m-1]}</text>`;
    g+=`<rect class="hit" x="${cx-bw/2}" y="${pt}" width="${bw}" height="${ch+pb}" data-act="gomonth" data-ym="${x.ym}"><title>${ymLabel(x.ym)}: ${money(x.t)}${x.fut?" (متوقع)":""}</title></rect>`});
  if(inc)g+=`<line class="inc" x1="${pl}" x2="${pl+cw}" y1="${y(inc)}" y2="${y(inc)}"/><text class="inclab" x="${pl+2}" y="${y(inc)-4}">الدخل</text>`;
  return`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="المصروف الشهري للسنة">${g}</svg>
  <div class="legend"><span><i style="background:var(--fixed)"></i>التزامات ثابتة</span><span><i style="background:var(--accent)"></i>مصاريف متغيرة</span><span><i style="background:var(--muted);opacity:.35"></i>متوقع</span>${inc?`<span><i style="background:var(--warn)"></i>الدخل</span>`:""}</div></div>`;
}
function compareBlock(){

  const ch=[...new Set([...Object.keys(catsA),...Object.keys(catsB)])].map(c=>({c,d:(catsA[c]||0)-(catsB[c]||0)})).filter(x=>x.d).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);

  <div class="kpi"><span>${ymLabel(b)}</span><b>${money(tb)}</b><small>${diff==null?"":`<span class="${diff>0?"up":"down"}">${diff>0?"▲ أعلى":"▼ أقل"} ${Math.abs(Math.round(diff*100))}%</span> متوقع`}</small></div></div>
  ${ch.length?`<div class="panel" style="margin-top:10px">${ch.map(x=>`<div class="row" style="cursor:default"><span class="dot" style="background:${catColor(x.c)}"></span><span class="main"><span class="t">${esc(x.c)}</span></span><span class="amt num" style="color:${x.d>0?"var(--bad)":"var(--good)"}">${x.d>0?"+":"−"}${fmt(Math.abs(x.d))}</span></div>`).join("")}</div>`:""}</section>`;
}

  </div></section>`;
}

function computeAlerts(d){
  const out=[];const inc=d.income;
  const dom=pElapsed(CUR()),dim=pLen(CUR());
  const pace=d.variable/dom*dim+d.fixed;
  if(inc&&d.fixed+d.variable>inc)out.push({lvl:"bad",t:`صرفت أكتر من دخلك الشهر ده بـ ${money(d.fixed+d.variable-inc)}.`,s:"وقّف أي صرف مش ضروري لحد أول الشهر."});
  else if(inc&&dom>=5&&pace>inc)out.push({lvl:"bad",t:`بالمعدل ده هتصرف ${money(pace)} وده أكتر من دخلك.`,s:`عشان تقفل الشهر في السليم، متعدّيش ${money(Math.max(0,(inc-d.fixed-d.variable)/Math.max(1,dim-dom+1)))} في اليوم لباقي الشهر.`});
  const ratio=inc?d.fixed/inc:0;
  if(inc&&ratio>0.4)out.push({lvl:ratio>0.6?"bad":"warn",t:`الالتزامات الثابتة ${Math.round(ratio*100)}% من دخلك.`,s:"الطبيعي متعدّيش 40%. بلاش أقساط جديدة لحد ما حاجة تخلص."});
  for(const c of S.settings.cats){const sp=d.byCat[c.name]||0,b=Number(c.budget)||0;if(!b||!sp)continue;
    if(sp>b)out.push({lvl:"bad",t:`عدّيت ميزانية «${c.name}» بـ ${money(sp-b)}.`});
    else if(sp/b>=.8)out.push({lvl:"warn",t:`«${c.name}» فاضلها ${money(b-sp)} بس من الميزانية.`})}
  S.fixed.forEach(f=>{const i=fixedInfo(f);if(!i.next)return;const n=daysUntil(i.next);if(n>=0&&n<=3)out.push({lvl:"warn",t:`قسط «${f.name}» ${money(f.amount)} مستحق ${n===0?"النهارده":n===1?"بكره":`بعد ${n} أيام`}.`})});
  if(S.expenses.length){const last=S.expenses.reduce((a,e)=>e.date>a?e.date:a,"");const gap=-daysUntil(last);if(gap>=3)out.push({lvl:"info",t:`مسجّلتش أي مصروف من ${gap} أيام.`,s:"سجّل أول بأول عشان الأرقام تبقى مظبوطة."})}
  const order={bad:0,warn:1,info:2};return out.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}
function alertsBlock(d){
  const a=computeAlerts(d);if(!a.length)return"";
  const shown=a.slice(0,5);
  return`<section><h2>تنبيهات<small>${a.length}</small></h2><div class="alerts">${shown.map(x=>`<div class="alert ${x.lvl==="bad"?"bad":x.lvl==="info"?"info":""}"><span class="ic">${x.lvl==="info"?"i":"!"}</span><div><b>${esc(x.t)}</b>${x.s?` ${esc(x.s)}`:""}</div></div>`).join("")}</div></section>`;
}

- الرد مختصر: من 150 لـ 250 كلمة. استخدم عناوين قصيرة تبدأ بـ ### ونقط تبدأ بـ - وممكن تبرز أرقام بـ **.
- لو البيانات قليلة (مفيش دخل أو مصاريف قليلة) قول كده بوضوح واطلب منه يسجّل أكتر، واديله نصايح عامة.
- في الاستثمار: اتكلم عن أنواع عامة بس، من غير ما ترشّح بنك أو صندوق أو سهم معين، ومن غير ما تذكر أسعار فايدة أو عوائد بأرقام لأنها بتتغير. قول إن الصندوق الطوارئ والأقساط ليهم أولوية. واختم بسطر إن دي معلومات عامة مش نصيحة استثمارية مرخصة، وإنه يراجع العوائد الحالية ويستشير مختص قبل أي قرار.
- متخترعش أرقام مش موجودة في البيانات.`;
  const input=[{role:"user",content:`${sys}\n\nالبيانات:\n${JSON.stringify(financeSummary())}\n\nالطلب: ${PROMPTS[kind]}`}];
  AI.ctrl=new AbortController();
  try{
    const r=await AI.sample(input,{signal:AI.ctrl.signal,modelTier:"default",cache:false,onText:({text})=>{AI.out=text;const el=document.getElementById("aiOut");if(el)el.innerHTML=mdLite(text)}});
    AI.out=r.text;
  }catch(e){
    if(e&&e.code==="not_granted")AI.out="⚠️ محتاج توافق على استخدام المساعد من رسالة الإذن اللي ظهرت. جرّب تاني ووافق.";
    else if(e&&e.code==="rate_limited")AI.out="⚠️ طلبات كتير ورا بعض. استنى دقيقة وجرّب تاني.";
    else if(e&&e.name==="AbortError")AI.out="";
    else AI.out=(e&&e.text)||"⚠️ المساعد مش متاح دلوقتي. جرّب كمان شوية.";
  }
  AI.busy=false;render();
}
function mdLite(t){
  const lines=esc(t).split(/\n/);let h="",inUl=false;
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(const ln of lines){const l=ln.trim();
    if(/^[-•*]\s+/.test(l)){if(!inUl){h+="<ul>";inUl=true}h+=`<li>${inl(l.replace(/^[-•*]\s+/,""))}</li>`;continue}
    if(inUl){h+="</ul>";inUl=false}
    if(/^#{1,4}\s+/.test(l))h+=`<h4>${inl(l.replace(/^#{1,4}\s+/,""))}</h4>`;else if(l)h+=`<p>${inl(l)}</p>`}
  if(inUl)h+="</ul>";return h;
}
function advisorBlock(){
  loadSample();
  if(AI.checked&&!AI.sample)return"";
  const asks=[["plan","خطة للمرتب","توزيع الدخل على الفئات مقابل صرفك الفعلي"],["month","مراجعة الشهر ده","ماشي كويس؟ وتعمل إيه لباقي الشهر"],["save","أوفّر منين؟","أكبر 5 أماكن توفّر فيها بالأرقام"],["invest","أبدأ أستثمر إزاي؟","صندوق طوارئ وأنواع استثمار عامة"]];
  return`<section><h2>مستشارك المالي<small>بالذكاء الاصطناعي</small></h2><div class="adv">
  <div class="asks">${asks.map(([k,t,d])=>`<button class="ask" type="button" data-act="ai" data-k="${k}" ${AI.busy||!AI.sample?"disabled":""}><span>${t}<small>${d}</small></span></button>`).join("")}</div>
  ${AI.busy||AI.out?`<div class="out" id="aiOut" aria-live="polite">${AI.out?mdLite(AI.out):"بيحلّل أرقامك…"}</div>`:""}
  ${AI.busy?`<button class="btn ghost" type="button" data-act="aiStop">إيقاف</button>`:""}
  <p class="note">المستشار بيشوف ملخص أرقامك بس (الإجماليات والفئات والأقساط) وقت ما تطلب. النصايح عامة ومش بديل عن مستشار مالي مرخص.</p>
  </div></section>`;
}

/* ---------- sheets ---------- */
const host=document.getElementById("sheetHost");
function openSheet(html,onMount){host.innerHTML=`<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;onMount&&onMount(host.querySelector(".sheet"));const f=host.querySelector("[autofocus]");f&&setTimeout(()=>f.focus(),60)}
function closeSheet(){host.innerHTML=""}

function expSheet(e){
  const isNew=!e;e=e||{date:TODAY,cat:"",pay:S.settings.pays[0]||"",amount:"",item:"",note:""};
  const cats=S.settings.cats.map(c=>c.name);if(e.cat&&!cats.includes(e.cat))cats.push(e.cat);
  openSheet(`<h3>${isNew?"مصروف جديد":"تعديل مصروف"}<button type="button" data-act="close" aria-label="إغلاق">✕</button></h3>
  <div class="field"><label for="e-amt">المبلغ (ج.م)</label><input id="e-amt" class="amount-in num" inputmode="decimal" value="${esc(e.amount)}" placeholder="0" autofocus></div>
  <div class="field"><span class="flabel">الفئة</span><div class="chips" id="e-cats">${cats.map(c=>`<button type="button" class="chip" data-pick="cat" data-v="${esc(c)}" aria-pressed="${c===e.cat}"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</button>`).join("")}</div></div>
  <div class="field"><label for="e-item">البند</label><input id="e-item" value="${esc(e.item)}" placeholder="مثلاً: كورس Excel، بقالة الأسبوع"></div>
  <div class="grid2"><div class="field"><label for="e-date">التاريخ</label><input id="e-date" type="date" value="${esc(e.date)}"></div>
  <div class="field"><label for="e-note">ملاحظة</label><input id="e-note" value="${esc(e.note)}" placeholder="اختياري"></div></div>
  <div class="field"><span class="flabel">طريقة الدفع</span><div class="chips">${S.settings.pays.map(p=>`<button type="button" class="chip" data-pick="pay" data-v="${esc(p)}" aria-pressed="${p===e.pay}">${esc(p)}</button>`).join("")}</div></div>
  <div class="err" id="e-err"></div>
  <div class="actions"><button class="btn" type="button" data-act="saveExp" data-id="${esc(e.id||"")}">${isNew?"إضافة":"حفظ"}</button>${isNew?"":`<button class="btn danger" type="button" data-act="delExp" data-id="${esc(e.id)}">حذف</button>`}</div>`);
}
function fixedSheet(f){
  const isNew=!f;f=f||{name:"",type:"قسط",amount:"",day:"",start:THIS_YM,end:"",note:""};
  openSheet(`<h3>${isNew?"قسط أو التزام جديد":"تعديل الالتزام"}<button type="button" data-act="close" aria-label="إغلاق">✕</button></h3>
  <div class="field"><label for="f-name">الاسم</label><input id="f-name" value="${esc(f.name)}" placeholder="مثلاً: قسط العربية" autofocus></div>
  <div class="field"><span class="flabel">النوع</span><div class="chips">${FTYPES.map(t=>`<button type="button" class="chip" data-pick="ftype" data-v="${esc(t)}" aria-pressed="${t===f.type}">${esc(t)}</button>`).join("")}</div></div>
  <div class="grid2"><div class="field"><label for="f-amt">المبلغ الشهري</label><input id="f-amt" class="num" inputmode="decimal" value="${esc(f.amount)}" placeholder="0"></div>

  <div class="actions"><button class="btn" type="button" data-act="saveFixed" data-id="${esc(f.id||"")}">${isNew?"إضافة":"حفظ"}</button>${isNew?"":`<button class="btn danger" type="button" data-act="delFixed" data-id="${esc(f.id)}">حذف</button>`}</div>`);

const picked=k=>{const b=host.querySelector(`[data-pick="${k}"][aria-pressed="true"]`);return b?b.dataset.v:""};
const val=id=>(document.getElementById(id)||{}).value||"";
const numv=id=>Number(String(val(id)).replace(/[^\d.]/g,""));

function toast(msg){const t=document.getElementById("toastHost");t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML="",2400)}

async function exportCsv(){
  const rows=[["النوع","التاريخ/البداية","البند","الفئة/النوع","المبلغ","طريقة الدفع/آخر شهر","ملاحظات"]];
  [...S.expenses].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>rows.push(["متغير",e.date,e.item,e.cat,e.amount,e.pay,e.note]));
  S.fixed.forEach(f=>rows.push(["ثابت",f.start,f.name,f.type,f.amount,f.end||"مستمر",f.note]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  await saveFile(`مصاريفي-${TODAY}.csv`,new Blob([csv],{type:"text/csv"}));
}
async function saveFile(filename,blob){
  let dl=null;try{dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename,data:blob})}catch(e){toast("الحفظ اتلغى")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){toast("التصدير مش متاح هنا")}
}
function backup(){saveFile(`مصاريفي-نسخة-احتياطية-${TODAY}.json`,new Blob([JSON.stringify({app:"masarifi",v:1,settings:S.settings,expenses:S.expenses,fixed:S.fixed})],{type:"application/json"}))}
async function restore(file){
  try{const d=JSON.parse(await file.text());if(d.app!=="masarifi")throw 0;
    S.settings={...S.settings,...d.settings};await api.saveSettings(S.settings);
    for(const e of d.expenses||[])await api.put("expenses",e.id,e);
    for(const f of d.fixed||[])await api.put("fixed",f.id,f);
    draft=null;render();toast(`اترجّع ${(d.expenses||[]).length} مصروف و${(d.fixed||[]).length} التزام`)}
  catch(e){toast("الملف ده مش نسخة احتياطية من مصاريفي")}
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const tabBtn=ev.target.closest("[data-tab]");
  if(tabBtn){S.tab=tabBtn.dataset.tab;draft=null;try{localStorage.setItem("masarif.tab",S.tab)}catch(e){}render();window.scrollTo(0,0);return}
  const pick=ev.target.closest("[data-pick]");
  if(pick){pick.parentElement.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed",String(b===pick)));return}
  const el=ev.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==="closeScrim"&&ev.target!==el)return;
  switch(act){
    case"yprev":S.ay--;render();break;
    case"ynext":S.ay++;render();break;
    case"gomonth":S.ym=el.dataset.ym;S.tab="month";render();window.scrollTo(0,0);break;
    case"mprev":S.ymTouched=true;S.ym=addM(S.ym,-1);render();break;
    case"mnext":S.ymTouched=true;S.ym=addM(S.ym,1);render();break;
    case"close":case"closeScrim":closeSheet();break;
    case"goSettings":S.tab="settings";render();break;
    case"addExp":if(!api)return;expSheet();break;
    case"editExp":expSheet(S.expenses.find(x=>x.id===id));break;
    case"addFixed":if(!api)return;fixedSheet();break;
    case"editFixed":fixedSheet(S.fixed.find(x=>x.id===id));break;
    case"saveExp":{
      const amount=numv("e-amt"),cat=picked("cat"),date=val("e-date");
      const err=document.getElementById("e-err");
      if(!amount){err.textContent="اكتب المبلغ.";return} if(!cat){err.textContent="اختار الفئة.";return} if(!date){err.textContent="اختار التاريخ.";return}
      el.disabled=true;
      await api.put("expenses",id||null,{amount,cat,date,item:val("e-item").trim(),note:val("e-note").trim(),pay:picked("pay")});
      closeSheet();{const pp=periodOf(date);if(pp!==S.ym){S.ym=pp;render()}}toast(id?"اتحفظ":"اتسجّل المصروف");break}
    case"saveFixed":{
      const name=val("f-name").trim(),amount=numv("f-amt"),day=Math.round(numv("f-day")),start=val("f-start"),end=val("f-end");
      const err=document.getElementById("f-err");
      if(!name){err.textContent="اكتب اسم الالتزام.";return} if(!amount){err.textContent="اكتب المبلغ الشهري.";return}
      if(day&&(day<1||day>31)){err.textContent="يوم الاستحقاق من 1 لـ 31.";return} if(!start){err.textContent="اختار أول شهر.";return}
      if(end&&end<start){err.textContent="آخر شهر لازم يكون بعد أول شهر.";return}
      el.disabled=true;
      await api.put("fixed",id||null,{name,amount,day:day||"",start,end:end||"",type:picked("ftype")||"أخرى",note:val("f-note").trim()});
      closeSheet();toast(id?"اتحفظ":"اتضاف الالتزام");break}
    case"delExp":case"delFixed":
      if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="اضغط تاني للتأكيد";return}
      await api.del(act==="delExp"?"expenses":"fixed",id);closeSheet();toast("اتمسح");break;
    case"addCat":readDraft();draft.cats.push({name:"",budget:0});render();{const l=document.querySelectorAll("[data-cn]");l[l.length-1]&&l[l.length-1].focus()}break;
    case"delCat":readDraft();draft.cats.splice(+el.dataset.i,1);render();break;
    case"addPay":readDraft();draft.pays.push("");render();{const l=document.querySelectorAll("[data-p]");l[l.length-1]&&l[l.length-1].focus()}break;
    case"delPay":readDraft();draft.pays.splice(+el.dataset.i,1);render();break;
    case"resetDraft":draft=null;render();break;
    case"saveSettings":{
      readDraft();
      const cats=draft.cats.filter(c=>c.name);const names=new Set();
      for(const c of cats){if(names.has(c.name)){toast(`الفئة «${c.name}» مكررة`);return}names.add(c.name)}
      const s={income:draft.income,startDay:draft.startDay||1,cats:cats.length?cats:DEFAULT_CATS,pays:draft.pays.filter(Boolean)};
      el.disabled=true;await api.saveSettings(s);draft=null;render();toast("اتحفظت الإعدادات");break}
    case"export":exportCsv();break;
    case"toggleBud":S.showAllBud=!S.showAllBud;render();break;
    case"toggleExp":S.showAllExp=!S.showAllExp;render();break;
    case"ai":askAI(el.dataset.k);break;
    case"aiStop":AI.ctrl&&AI.ctrl.abort();break;
    case"backup":backup();break;
  }
});
document.addEventListener("change",e=>{if(e.target.id==="restoreIn"&&e.target.files[0])restore(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&host.innerHTML)closeSheet()});
document.addEventListener("input",e=>{if(e.target.matches("[data-cb],#s-income")){readDraft();const t=document.querySelector("section h2 small.num");if(t&&S.tab==="settings"){const total=draft.cats.reduce((a,c)=>a+(Number(c.budget)||0),0);document.querySelectorAll("section h2 small.num")[0].textContent=`الإجمالي ${money(total)}`}}});

init();
})();
